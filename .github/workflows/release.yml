name: build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", "packaging/**", "pyproject.toml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Doppel-Windows.zip
          - os: macos-latest
            asset: Doppel-macOS.zip
          - os: ubuntu-22.04
            asset: Doppel-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[heic]" "pyinstaller>=6"
      - name: Build
        run: pyinstaller packaging/doppel.spec --noconfirm
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Doppel.exe -DestinationPath ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Doppel.app ../${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist Doppel
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release v${{ steps.ver.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Doppel ${{ steps.ver.outputs.version }}
          files: ${{ matrix.asset }}
          generate_release_notes: true
